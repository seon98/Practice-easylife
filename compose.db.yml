services:
  db:
    image: postgres:17-alpine
    container_name: easylife-postgres

    environment:
      POSTGRES_USER: easylife
      POSTGRES_PASSWORD: easylife-local
      POSTGRES_DB: easylife

    ports:
      - "5433:5432"

    volumes:
      - easylife-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U easylife -d easylife",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  easylife-postgres-data:
